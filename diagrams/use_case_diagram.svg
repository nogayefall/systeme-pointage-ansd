<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000">
  <style>
    .title { font: 24px 'Segoe UI', Arial, sans-serif; fill: #0F3F6B; font-weight: 800; }
    .subtitle { font: 16px 'Segoe UI', Arial, sans-serif; fill: #1F4B7A; }
    .actor { font: 20px 'Segoe UI', Arial, sans-serif; fill: #0F3F6B; font-weight:700; }
    .actor-line { stroke: #0F3F6B; stroke-width: 3; }
    .actor-box { fill: #F2F7FB; stroke: #5795C8; stroke-width: 2; rx: 12; }
    .usecase { fill: #FFFFFF; stroke: #1F78B4; stroke-width: 3; rx: 50; ry: 50; }
    .usecase-text { font: 18px 'Segoe UI', Arial, sans-serif; fill: #1F78B4; font-weight: 700; }
    .note { font: 14px 'Segoe UI', Arial, sans-serif; fill: #333333; }
    .section-title { font: 18px 'Segoe UI', Arial, sans-serif; fill: #0F3F6B; font-weight:700; }
    .connector { stroke: #4E5A6A; stroke-width: 2; }
    .group-box { fill: rgba(47, 110, 186, 0.08); stroke: #2F6EBA; stroke-width: 2; stroke-dasharray: 8 6; rx: 22; }
  </style>

  <text x="750" y="45" text-anchor="middle" class="title">Diagramme de cas d'utilisation</text>
  <text x="750" y="75" text-anchor="middle" class="subtitle">Système de pointage, congés et gestion des utilisateurs</text>

  <!-- Actor column -->
  <g id="actors">
    <rect x="40" y="110" width="220" height="90" class="actor-box" />
    <text x="150" y="160" text-anchor="middle" class="actor">Agent</text>
    <line x1="150" y1="200" x2="280" y2="200" class="actor-line" />

    <rect x="40" y="250" width="220" height="90" class="actor-box" />
    <text x="150" y="300" text-anchor="middle" class="actor">Responsable RH</text>
    <line x1="150" y1="340" x2="280" y2="340" class="actor-line" />

    <rect x="40" y="390" width="220" height="90" class="actor-box" />
    <text x="150" y="440" text-anchor="middle" class="actor">Super Admin</text>
    <line x1="150" y1="480" x2="280" y2="480" class="actor-line" />
  </g>

  <!-- Use case groups -->
  <rect x="300" y="100" width="1060" height="340" class="group-box" />
  <text x="320" y="135" class="section-title">Usage général des agents</text>
  <ellipse cx="700" cy="170" rx="260" ry="42" class="usecase" />
  <text x="700" y="175" text-anchor="middle" class="usecase-text">Se connecter / s'authentifier</text>
  <ellipse cx="700" cy="250" rx="260" ry="42" class="usecase" />
  <text x="700" y="255" text-anchor="middle" class="usecase-text">Consulter le tableau de bord</text>
  <ellipse cx="700" cy="330" rx="260" ry="42" class="usecase" />
  <text x="700" y="335" text-anchor="middle" class="usecase-text">Recevoir les notifications de statut</text>

  <rect x="300" y="470" width="1060" height="390" class="group-box" />
  <text x="320" y="505" class="section-title">Actions spécifiques</text>
  <ellipse cx="550" cy="620" rx="250" ry="42" class="usecase" />
  <text x="550" y="625" text-anchor="middle" class="usecase-text">Enregistrer un pointage</text>
  <ellipse cx="950" cy="620" rx="250" ry="42" class="usecase" />
  <text x="950" y="625" text-anchor="middle" class="usecase-text">Consulter mes pointages</text>
  <ellipse cx="550" cy="700" rx="250" ry="42" class="usecase" />
  <text x="550" y="705" text-anchor="middle" class="usecase-text">Demander un congé</text>
  <ellipse cx="950" cy="700" rx="250" ry="42" class="usecase" />
  <text x="950" y="705" text-anchor="middle" class="usecase-text">Consulter mes demandes de congé</text>
  <ellipse cx="550" cy="780" rx="250" ry="42" class="usecase" />
  <text x="550" y="785" text-anchor="middle" class="usecase-text">Soumettre justificatif / modifier demande</text>

  <rect x="300" y="880" width="1060" height="170" class="group-box" />
  <text x="320" y="915" class="section-title">Validation et administration</text>
  <ellipse cx="650" cy="945" rx="280" ry="42" class="usecase" />
  <text x="650" y="950" text-anchor="middle" class="usecase-text">Valider ou rejeter une demande de congé</text>
  <ellipse cx="1050" cy="945" rx="280" ry="42" class="usecase" />
  <text x="1050" y="950" text-anchor="middle" class="usecase-text">Gérer utilisateurs et rôles</text>

  <!-- Connectors Agent -->
  <line x1="280" y1="200" x2="520" y2="170" class="connector" />
  <line x1="280" y1="200" x2="520" y2="250" class="connector" />
  <line x1="280" y1="200" x2="520" y2="330" class="connector" />
  <line x1="280" y1="200" x2="520" y2="620" class="connector" />
  <line x1="280" y1="200" x2="950" y2="620" class="connector" />
  <line x1="280" y1="200" x2="520" y2="700" class="connector" />
  <line x1="280" y1="200" x2="950" y2="700" class="connector" />
  <line x1="280" y1="200" x2="520" y2="780" class="connector" />

  <!-- Connectors RH -->
  <line x1="280" y1="340" x2="650" y2="945" class="connector" />
  <line x1="280" y1="340" x2="750" y2="945" class="connector" />
  <line x1="280" y1="340" x2="650" y2="700" class="connector" stroke-dasharray="6 6" />

  <!-- Connectors Super Admin -->
  <line x1="280" y1="480" x2="1050" y2="945" class="connector" />
  <line x1="280" y1="480" x2="650" y2="945" class="connector" />

  <!-- Legend -->
  <rect x="340" y="30" width="280" height="90" rx="12" ry="12" fill="#FFFFFF" stroke="#A7BED3" stroke-width="2" />
  <text x="360" y="55" class="note" font-weight="700">Légende</text>
  <text x="360" y="80" class="note">• Agent = pointage, congé, lecture</text>
  <text x="360" y="100" class="note">• Responsable RH = validation de congés</text>
  <text x="360" y="120" class="note">• Super Admin = gestion des utilisateurs</text>

  <text x="750" y="990" text-anchor="middle" class="note">Fichier SVG lisible généré pour mon_projet_pointage</text>
</svg>
